# Canonical studio release workflow (T-146 / T-148).
#
# Agent protocol forbids editing live `.github/workflows/`. A human must copy
# this file to `.github/workflows/release-studio.yml` before GitHub runs it.
#
# WASM-only publish path (tests run in CI `web` job). Triggers:
#   - successful CI on main/master → moving tag `studio-latest` (prod tarball +
#     -latest.tgz alias) plus auto-cut `studio-v{version}` when absent
#   - push tag studio-v*  → immutable semver release (versioned tarball only)
name: Release studio

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, master]
  push:
    tags:
      - "studio-v*"

concurrency:
  group: release-studio-prod
  cancel-in-progress: true

jobs:
  release:
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'push' &&
       startsWith(github.ref, 'refs/tags/studio-v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          lfs: true
          fetch-depth: 0

      - name: Download CI WASM artifacts
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: ci-rust-wasm-build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Rust
        if: github.event_name == 'push'
        uses: dtolnay/rust-toolchain@stable

      - name: Build WASM kernel
        if: github.event_name == 'push'
        run: ./scripts/build-wasm.sh

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build publishable library
        working-directory: web
        run: npm run build:lib

      - name: Pack tarball
        working-directory: web
        run: |
          npm pack
          PACKED="$(ls oliverevans96-blueberries-voi-studio-*.tgz)"
          cp "$PACKED" oliverevans96-blueberries-voi-studio-latest.tgz
          echo "PACKED=$PACKED" >> "$GITHUB_ENV"

      - name: Read package version
        id: pkg
        working-directory: web
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Resolve pushed studio-v tag
        id: rel
        if: github.event_name == 'push'
        run: echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Check immutable studio-v tag exists
        id: imm
        if: github.event_name == 'workflow_run'
        run: |
          git fetch --tags --force
          TAG="studio-v${{ steps.pkg.outputs.version }}"
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish studio-latest (moving prod)
        if: github.event_name == 'workflow_run'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: studio-latest
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: Blueberry studio v${{ steps.pkg.outputs.version }} (${{ github.event.workflow_run.head_sha }})
          files: |
            web/${{ env.PACKED }}
            web/oliverevans96-blueberries-voi-studio-latest.tgz
          generate_release_notes: true
          make_latest: true

      - name: Publish immutable studio-v release (workflow_run)
        if: github.event_name == 'workflow_run' && steps.imm.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: studio-v${{ steps.pkg.outputs.version }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: Blueberry studio v${{ steps.pkg.outputs.version }} (${{ github.event.workflow_run.head_sha }})
          files: web/${{ env.PACKED }}
          generate_release_notes: true
          make_latest: false

      - name: Publish immutable studio-v release (tag push)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Blueberry studio v${{ steps.pkg.outputs.version }} (${{ github.sha }})
          files: web/${{ env.PACKED }}
          generate_release_notes: true
          make_latest: false
