# Superseded: `cargo test` runs in CI `rust` job (parallel with python/web).
# Kept for manual reruns only.
name: Rust kernel

on:
  workflow_dispatch:

jobs:
  rust-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo test voi_core + voi_py
        run: cargo test -p voi_core -p voi_py --locked
