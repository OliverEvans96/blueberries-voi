# Web quality gate for PRs touching `web/` (T-146).
#
# Agent protocol forbids editing live `.github/workflows/`. A human must copy
# this file to `.github/workflows/web-quality.yml` (or merge its job into ci.yml).
name: Web quality

on:
  pull_request:
    paths:
      - "web/**"
      - "scripts/build-wasm.sh"
      - "crates/voi_wasm/**"
      - "packaging/wasm/**"

concurrency:
  group: web-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build WASM kernel
        run: ./scripts/build-wasm.sh

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Vitest
        working-directory: web
        run: npm test

      - name: Build publishable library
        working-directory: web
        run: npm run build:lib

      - name: Pack tarball (smoke)
        working-directory: web
        run: npm pack
