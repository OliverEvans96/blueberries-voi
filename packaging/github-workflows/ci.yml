# Canonical CI workflow source.
#
# Agent protocol forbids editing live `.github/workflows/`. A human must copy
# this file to `.github/workflows/ci.yml` before CI picks up changes.
#
# Quality job: single Python from repo pin (`.python-version` → 3.11).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          uv venv --python 3.11
          uv sync --all-extras --python 3.11 --frozen
          uv run maturin develop --release -m crates/voi_py/Cargo.toml

      - name: Ruff (lint)
        run: uv run --python 3.11 ruff check .

      - name: Ruff (format check)
        run: uv run --python 3.11 ruff format --check .

      - name: Mypy
        run: uv run --python 3.11 mypy src tests

      - name: Pytest with coverage
        run: >-
          uv run --python 3.11 pytest -n auto
          --cov=blueberries_voi
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=80
