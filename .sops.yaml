# SOPS encrypts secrets/secrets.enc.yaml using your OpenPGP key.
# Replace the fingerprint below with yours (40 hex chars, no spaces):
#   gpg --list-secret-keys --with-fingerprint
creation_rules:
  - path_regex: ^secrets/.*\.enc\.(yaml|yml|json)$
    pgp: >-
      397878E57C7B94CB51D7359DDAB6719C752FBC23
