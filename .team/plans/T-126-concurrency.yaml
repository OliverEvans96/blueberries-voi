ticket: T-126
parent_tip: team/T-124/implement
optimize: balanced
description: >
  Follow-up UX redesign of the studio web app: replace the vertical
  chapter/section nav column with a horizontal command bar, consolidate
  Glossary/VOI-reference/Shortcut-help into one reference drawer, convert the
  Day Inspector into a floating hover tooltip, tab the four stacked store
  charts into two views, and fix two interaction defects found during visual
  QA (chart-unavailable hatch blocking clicks; observation-ladder chip
  active-state not syncing). Web-only (web/src); no Python/wire changes.
batch_below:
  max_files: 2
  max_prod_loc: 50
