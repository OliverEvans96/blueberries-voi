ticket: T-158
parent_tip: main
optimize: balanced
max_parallel: 5
description: >
  Layout v7 — move tuning dock to right-side TuningDrawer (gear trigger), single-row
  cockpit grid metrics | belief | sidebar, 2-column interleaved drawer interior.

tasks:
  - id: architect
