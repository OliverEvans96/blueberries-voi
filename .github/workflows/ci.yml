# Canonical CI workflow source.
#
# Agent protocol forbids editing live `.github/workflows/`. A human must copy
# (or symlink) this file to `.github/workflows/ci.yml` before CI picks up changes.
#
# Quality job: single Python from repo pin (`.python-version` → 3.11).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,rust]"
          maturin develop --release -m crates/voi_py/Cargo.toml

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format check)
        run: ruff format --check .

      - name: Mypy
        run: mypy src tests

      - name: Pytest with coverage
        run: >-
          pytest -n auto
          --cov=blueberries_voi
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=80
