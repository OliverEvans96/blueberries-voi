# Tag-driven slim / browser wheel → GitHub Release (T-046 / ADR 0099).
#
# Agent protocol forbids editing live `.github/workflows/`. A human must copy
# (or symlink) this file to `.github/workflows/release-slim-wheel.yml`.
#
# Triggers on version tags (v*). Builds a slim wheel (no hard pyarrow /
# matplotlib), smokes METADATA, uploads the asset to the GitHub Release, and
# dry-runs upload-artifact on pull_request for PR verification.
#
# Pins (echo of ADR 0099):
#   PYODIDE_VERSION=314.0.4
#   CPYTHON_VERSION=3.14.2
name: Release slim wheel

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  pull_request:
    paths:
      - "pyproject.toml"
      - "src/blueberries_voi/**"
      - "packaging/**"
      - "scripts/build_slim_wheel.py"
      - "scripts/smoke_slim_wheel.py"

env:
  PYODIDE_VERSION: "314.0.4"
  CPYTHON_VERSION: "3.14.2"

jobs:
  build-slim-wheel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build slim browser-oriented wheel
        run: python scripts/build_slim_wheel.py

      - name: Smoke slim wheel METADATA (no pyarrow/matplotlib hard deps)
        run: python scripts/smoke_slim_wheel.py

      - name: Upload wheel artifact (PR dry-run)
        uses: actions/upload-artifact@v4
        with:
          name: blueberries-voi-slim-wheel
          path: dist/*.whl

      - name: Publish wheel to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            src/blueberries_voi/data/abdella_arrival_ages.npz
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
