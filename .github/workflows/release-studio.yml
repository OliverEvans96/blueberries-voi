# Canonical studio release workflow (T-146 / main-push prod).
#
# Agent protocol forbids editing live `.github/workflows/`. A human must copy
# this file to `.github/workflows/release-studio.yml` before GitHub runs it.
#
# WASM-only publish path (tests run in CI `web` job). Triggers:
#   - successful CI on main/master → moving tag `studio-latest` (prod tarball)
#   - push tag studio-v*  → immutable semver release (optional manual pins)
name: Release studio

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, master]
  push:
    tags:
      - "studio-v*"

concurrency:
  group: release-studio-prod
  cancel-in-progress: true

jobs:
  release:
    if: >
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'push' &&
       startsWith(github.ref, 'refs/tags/studio-v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          lfs: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build WASM kernel
        run: ./scripts/build-wasm.sh

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build publishable library
        working-directory: web
        run: npm run build:lib

      - name: Pack tarball
        working-directory: web
        run: |
          npm pack
          PACKED="$(ls oliverevans96-blueberries-voi-studio-*.tgz)"
          cp "$PACKED" oliverevans96-blueberries-voi-studio-latest.tgz
          echo "PACKED=$PACKED" >> "$GITHUB_ENV"

      - name: Resolve release tag
        id: rel
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=studio-latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Read package version
        id: pkg
        working-directory: web
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.event.workflow_run.head_sha || github.sha }}
          name: Blueberry studio v${{ steps.pkg.outputs.version }} (${{ github.sha }})
          files: |
            web/${{ env.PACKED }}
            web/oliverevans96-blueberries-voi-studio-latest.tgz
          generate_release_notes: true
          make_latest: true
