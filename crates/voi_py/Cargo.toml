[package]
name = "voi_py"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "PyO3 bindings: blueberries_voi._core"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
voi_core = { path = "../voi_core" }
pyo3 = { workspace = true, features = ["extension-module"] }
