[package]
name = "voi_py"
version = "0.2.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "PyO3 bindings: blueberries_voi._core"

[lib]
name = "_core"
crate-type = ["cdylib"]

[package.metadata.maturin]
name = "blueberries_voi._core"
python-source = "../../src"


[dependencies]
voi_core = { path = "../voi_core" }
pyo3 = { workspace = true, features = ["extension-module"] }
rand = { workspace = true }
rand_pcg = { workspace = true }
serde_json = { workspace = true }
