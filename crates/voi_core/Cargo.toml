[package]
name = "voi_core"
version = "0.2.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Shared blueberry VOI physics, filter, and episode kernels (no Python/JS types)"

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
rand_pcg = { workspace = true }
rand_distr = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "tradeoff_forecast"
harness = false
