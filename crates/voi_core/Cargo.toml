[package]
name = "voi_core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Shared blueberry VOI physics, filter, and episode kernels (no Python/JS types)"

[lib]
crate-type = ["rlib"]

[[bin]]
name = "bench_day_timing"
path = "src/bin/bench_day_timing.rs"

[[bin]]
name = "bench_freshness_sweep"
path = "src/bin/bench_freshness_sweep.rs"

[[bin]]
name = "bench_c2_algorithms"
path = "src/bin/bench_c2_algorithms.rs"

[[bin]]
name = "bench_c2_accuracy"
path = "src/bin/bench_c2_accuracy.rs"

[[bin]]
name = "bench_c2_a_totals_study"
path = "src/bin/bench_c2_a_totals_study.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
rand_pcg = { workspace = true }
rand_distr = { workspace = true }
sha2 = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
