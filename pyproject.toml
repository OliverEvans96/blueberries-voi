[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blueberries-voi"
version = "0.1.0"
description = "Simulation, analysis, and visualization for blueberry value-of-information work"
readme = "README.md"
requires-python = ">=3.11"
# Slim / browser install story (ADR 0099 / T-046): no hard pyarrow or matplotlib.
dependencies = [
    "numpy>=2.4.6",
    "scipy>=1.17.1",
]

[project.optional-dependencies]
# Slim / Pyodide interactive path (ADR 0099): no pyarrow or matplotlib.
browser = []
# Desktop Gate 0 / Abdella Parquet (ADR 0085).
data = [
    "pyarrow>=25.0.1",
]
# Static figures / Gate 0 plots (ADR 0084); JS owns browser charts.
viz = [
    "matplotlib>=3.11.1",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.8.0",
    "pytest-testmon>=2.1.0",
    "mypy>=1.8.0",
    "ruff>=0.4.0",
    # Native/CI tests exercise desktop Gate 0 + viz (not on the browser wheel).
    "pyarrow>=25.0.1",
    "matplotlib>=3.11.1",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
]
notebooks = [
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
]
api = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
]
rust = [
    "maturin>=1.8.0",
]
# FreshNet ingest / fit only (ADR 0115 / T-078). Not core or browser.
freshnet = [
    "datasets>=3.0.0",
]

[project.scripts]
blueberries-voi = "blueberries_voi.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blueberries_voi = ["data/*.npz", "py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]
extend-exclude = ["notebooks", ".team"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "TCH", # type-checking blocks
    "PTH", # pathlib
    "RUF", # ruff-specific
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "pyarrow",
    "pyarrow.*",
    "scipy",
    "scipy.*",
    "pandas",
    "pandas.*",
    "datasets",
    "datasets.*",
    "huggingface_hub",
    "huggingface_hub.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage, xdist, and testmon stay off by default (fast qa/implement loops).
# Verify/CI: see AGENTS.md for the full pytest -n auto --cov… command (no testmon selection).
# Implement cache refresh: ./scripts/refresh-testmon.sh (pytest --testmon, no --cov).
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]

[tool.coverage.run]
branch = true
source_pkgs = ["blueberries_voi"]
disable_warnings = ["module-not-measured"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
