[workspace]
resolver = "2"
members = ["crates/voi_core", "crates/voi_py", "crates/voi_wasm"]
default-members = ["crates/voi_core"]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
pyo3 = { version = "0.29", features = ["abi3-py311"] }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
rand_pcg = "0.9"
rand_distr = "0.5"
getrandom = "0.3"
